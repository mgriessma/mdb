<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG-Sammlung - {% block title %}Home{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .main-container {
            min-height: calc(100vh - 100px);
        }
        .sidebar-col {
            min-height: 100%;
        }
        .content-col {
            min-height: 100%;
        }
        .table-responsive {
            max-height: 60vh;
            overflow-y: auto;
        }
        .filter-bar {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
        .data-table {
            font-size: 0.9rem;
        }
        .data-table th {
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }
        .modal-lg {
            max-width: 90%;
        }
        .form-control-sm {
            font-size: 0.875rem;
        }
        .table-active {
            background-color: rgba(0, 123, 255, 0.1) !important;
        }
        .action-btn {
            margin-right: 5px;
        }
        #map {
            height: 400px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .stats-card {
            transition: transform 0.2s;
        }
        .stats-card:hover {
            transform: translateY(-5px);
        }
        .list-group-item.active {
            background-color: #0d6efd;
            color: white;
            border-color: #0d6efd;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container-fluid main-container">
        <h1 class="my-4 text-center"><i class="bi bi-gem"></i> MG-Sammlung</h1>

        <div class="row">
            <!-- LEFT SIDEBAR COLUMN - Common to all pages -->
            <div class="col-md-3 sidebar-col pe-3">
                {% include 'sidebar.html' %}
            </div>

            <!-- MAIN CONTENT COLUMN - Changes per page -->
            <div class="col-md-9 content-col">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery for AJAX -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Leaflet for maps -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Global JavaScript for all pages -->
    <script>
        // Global search functionality - available on all pages
        function setupGlobalSearch() {
            const searchForm = document.getElementById('globalSearchForm');
            const searchInput = document.getElementById('globalSearchInput');
            const searchTableSelect = document.getElementById('searchTableSelect');
            const resultsContainer = document.getElementById('searchResultsContainer');
            const resultsDiv = document.getElementById('searchResults');

            if (!searchForm || !searchInput) return;

            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                performGlobalSearch();
            });

            searchInput.addEventListener('input', () => {
                if (searchInput.value.length === 0) {
                    resultsContainer.style.display = 'none';
                }
            });

            function performGlobalSearch() {
                const searchTerm = searchInput.value.trim();
                const table = searchTableSelect.value;

                if (!searchTerm) {
                    resultsContainer.style.display = 'none';
                    return;
                }

                resultsDiv.innerHTML = '<div class="list-group-item">Suche...</div>';
                resultsContainer.style.display = 'block';

                fetch(`/api/search?table=${table}&q=${encodeURIComponent(searchTerm)}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.results && data.results.length > 0) {
                            resultsDiv.innerHTML = '';

                            data.results.slice(0, 10).forEach(result => {
                                const item = document.createElement('a');
                                item.href = `/${table}?filter_col=${data.primary_key}&filter_text=${result[data.primary_key]}&match_mode=exact`;
                                item.className = 'list-group-item list-group-item-action';

                                let displayText = '';
                                if (table === 'provinz') {
                                    displayText = `${result.provinz || result.gid}`;
                                } else if (table === 'revier') {
                                    displayText = `${result.bergbaurevier || result.rid}`;
                                } else if (table === 'fundstellen') {
                                    displayText = `${result.fundstelle || result.fsid}`;
                                } else if (table === 'stufen') {
                                    displayText = `${result.sammlungsstueck || result.snr}`;
                                } else if (table === 'bilder') {
                                    displayText = `${result.sammlungsstueck || result.isnr}`;
                                }

                                item.textContent = displayText;
                                resultsDiv.appendChild(item);
                            });
                        } else {
                            resultsDiv.innerHTML = '<div class="list-group-item">Keine Ergebnisse gefunden</div>';
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        resultsDiv.innerHTML = '<div class="list-group-item text-danger">Fehler bei der Suche</div>';
                    });
            }
        }

        // Utility function to escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize global search when DOM is ready
        document.addEventListener('DOMContentLoaded', setupGlobalSearch);
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
